name: Weekly note draft

on:
  schedule:
    # 毎週火・金 21:00 JST (12:00 UTC) - 無料記事を週2本自動生成
    - cron: "0 12 * * 2"
    - cron: "0 12 * * 5"
  # 手動実行用。auto(既定)なら自動判定ロジック(scripts/generate_draft.py)
  # に任せる。free/paidを指定すれば強制もできる。
  # 定期実行(schedule)も常にautoで動き、いいタイミングで有料記事が
  # 自動的に混ざる(判定ルールはdocs/strategy.md参照)。
  workflow_dispatch:
    inputs:
      tier:
        description: "auto(自動判定・既定) / free(強制) / paid(強制)"
        type: choice
        options: [auto, free, paid]
        default: auto
      topic_id:
        description: "特定トピックを指定して(再)生成したい場合のtopic-id(空欄なら自動選択)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate draft
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIER: ${{ github.event.inputs.tier || 'auto' }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          set -o pipefail
          ARGS=(--tier "$TIER")
          if [ -n "$TOPIC_ID" ]; then
            ARGS+=(--topic-id "$TOPIC_ID")
          fi
          python scripts/generate_draft.py "${ARGS[@]}" | tee /tmp/draft.log
          RESOLVED_TIER=$(grep -m1 -oE '^\[[a-z]+\]' /tmp/draft.log | tr -d '[]')
          echo "tier=$RESOLVED_TIER" >> "$GITHUB_OUTPUT"

      - name: Get date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "新しい下書きを生成 (${{ steps.draft.outputs.tier }})"
          title: "週次note下書き [${{ steps.draft.outputs.tier }}] (${{ steps.date.outputs.today }})"
          body: |
            自動生成された下書きです。公開前に必ず内容を確認してください:

            - [ ] 医学的な内容が正確であること
            - [ ] 断定的な診断表現がないこと(docs/compliance.md 参照)
            - [ ] 免責文・CTAが含まれていること
            - [ ] (有料記事の場合)`▼ここから有料エリア`の位置でnoteの有料設定を行うこと

            確認後、note.comへ手動で転記・公開し、X文面も投稿してください。
          branch: auto-draft/${{ github.run_number }}
          add-paths: |
            content/drafts/**
            content/topics.yaml
            content/topics_paid.yaml
