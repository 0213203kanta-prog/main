name: Weekly note draft

on:
  schedule:
    # 毎週火・金 21:00 JST (12:00 UTC) - 無料記事を週2本自動生成
    - cron: "0 12 * * 2"
    - cron: "0 12 * * 5"
  # 手動実行用。tierを指定すれば有料記事(topics_paid.yaml)も生成できる。
  # 定期実行(schedule)は常にfree(無料記事)で動く。
  workflow_dispatch:
    inputs:
      tier:
        description: "free(無料記事) または paid(有料記事)"
        type: choice
        options: [free, paid]
        default: free

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIER: ${{ github.event.inputs.tier || 'free' }}
        run: python scripts/generate_draft.py --tier "$TIER"

      - name: Get date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "新しい下書きを生成 (${{ github.event.inputs.tier || 'free' }})"
          title: "週次note下書き [${{ github.event.inputs.tier || 'free' }}] (${{ steps.date.outputs.today }})"
          body: |
            自動生成された下書きです。公開前に必ず内容を確認してください:

            - [ ] 医学的な内容が正確であること
            - [ ] 断定的な診断表現がないこと(docs/compliance.md 参照)
            - [ ] 免責文・CTAが含まれていること
            - [ ] (有料記事の場合)`▼ここから有料エリア`の位置でnoteの有料設定を行うこと

            確認後、note.comへ手動で転記・公開し、X文面も投稿してください。
          branch: auto-draft/${{ github.run_number }}
          add-paths: |
            content/drafts/**
            content/topics.yaml
            content/topics_paid.yaml
