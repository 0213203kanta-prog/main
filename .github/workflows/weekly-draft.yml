name: Weekly note draft

on:
  schedule:
    # 毎週月曜 21:00 JST (12:00 UTC)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_draft.py

      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "新しい下書きを生成"
          title: "週次note下書き ($(date +'%Y-%m-%d'))"
          body: |
            自動生成された下書きです。公開前に必ず内容を確認してください:

            - [ ] 医学的な内容が正確であること
            - [ ] 断定的な診断表現がないこと(docs/compliance.md 参照)
            - [ ] 免責文・CTAが含まれていること

            確認後、note.comへ手動で転記・公開し、SNS文面も投稿してください。
          branch: auto-draft/${{ github.run_number }}
          add-paths: |
            content/drafts/**
            content/topics.yaml
